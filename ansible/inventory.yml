# ---------------------------------------------------------------------------
# inventory.yml — Inventaire réel du cluster
# (copie de inventory.example.yml, racine ; valeurs alignées sur requirements.md)
# Les secrets (tokens API) utilisent Ansible Vault : voir docs/06-ansible.md
# ---------------------------------------------------------------------------

all:
  children:
    # ---------- Nœuds Proxmox (cibles SSH) ----------
    pve:
      hosts:
        pve1:
          ansible_host: 192.168.1.10
          pve_corosync_ip: 10.10.0.1
        pve2:
          ansible_host: 192.168.1.11
          pve_corosync_ip: 10.10.0.2
        pve3:
          ansible_host: 192.168.1.12
          pve_corosync_ip: 10.10.0.3
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    # ---------- VMs du cluster (cibles SSH une fois provisionnées) ----------
    vms:
      hosts:
        dns01: { ansible_host: 10.10.10.20 }
        vpn01: { ansible_host: 10.10.10.21 }
        pbs01: { ansible_host: 10.10.30.10 }
        monitoring01: { ansible_host: 10.10.10.30 }
        app01: { ansible_host: 10.10.10.40 }
        app02: { ansible_host: 10.10.10.41 }
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3

  vars:
    # ---------- Réseaux (alignés sur requirements.md) ----------
    cluster_domain: cluster.local
    net_mgmt: 192.168.1.0/24
    net_corosync: 10.10.0.0/24
    net_vm: 10.10.10.0/24
    net_backup: 10.10.30.0/24
    vm_gateway: 10.10.10.1
    dns_servers: [10.10.10.20, 1.1.1.1]

    # ---------- Cluster / HA ----------
    pve_cluster_name: ha-cluster
    pve_watchdog: softdog        # softdog (défaut) | ipmi_watchdog | iTCO_wdt

    # ---------- Stockage ZFS ----------
    zfs_pool_data: tank
    zfs_pool_vm_dataset: tank/vm   # datasets des disques VM (doivent exister)
    replication_schedule: "*/5"    # RPO cible = 5 minutes (asynchrone)

    # ---------- Proxmox API (contrôle des modules community.proxmox) ----------
    # ATTENTION : ne mettez JAMAIS le token en clair ici.
    # Chiffrez ces variables avec : ansible-vault encrypt_string
    proxmox_api_host: 192.168.1.10
    proxmox_api_port: 8006
    proxmox_api_user: ansible@pve      # compte API dédié Ansible (doc 06 §3)
    proxmox_api_token_id: ansible@pve!ansible-token
    # proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    proxmox_validate_certs: false        # passe à true avec ACME/CA interne (doc 09)

    # ---------- PBS (Proxmox Backup Server) ----------
    pbs_host: 10.10.30.10
    pbs_datastore: datastore1
    pbs_user: root@pam
    # pbs_password: "{{ vault_pbs_password }}"

    # ---------- Supervision ----------
    monitoring_host: 10.10.10.30
    grafana_admin_user: admin
    # grafana_admin_password: "{{ vault_grafana_password }}"